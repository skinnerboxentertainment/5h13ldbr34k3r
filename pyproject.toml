[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shieldbreaker"
version = "0.1.0"
description = "Proof-of-concept circumvention of ShieldFont font-based text obfuscation; font-derived decoder"
readme = "README.md"
license = { text = "AGPL-3.0" }
requires-python = ">=3.10"
dependencies = [
    "fonttools>=4.40",
    "regex>=2023.6.3",
]

[project.scripts]
shieldguard = "shieldguard:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["shieldguard"]
